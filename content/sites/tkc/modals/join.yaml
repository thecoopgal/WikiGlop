id: join
title: Join The Kaleidoscope Collective
layout: form
render_mode: modal
send_email: thecoopgal@gmail.com

form:
  id: tkc_join
  title: Join The Kaleidoscope Collective
  intro: Tell us about yourself and how you'd like to participate.
  submit_label: Submit Application
  cancel_label: Cancel
  success_message: Thanks for applying to GloopGlop.

fields:
  - type: text
    name: name
    label: Name
    required: true

  - type: email
    name: email
    label: Email
    required: true

  - type: textarea
    name: why_join
    label: Why do you want to join the Kaleidoscope?
    required: true
    rows: 5

  - type: textarea
    name: contributions
    label: What would you like to contribute?
    required: false
    rows: 4

  - type: checkbox
    name: agree_values
    label: I support the cooperative values of the Kaleidoscope Collective.
    required: true
