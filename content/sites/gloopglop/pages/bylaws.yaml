    title: GloopGlop Bylaws
    summary: Governance document for GloopGlop.

  - type: markdown
    id: spacer-after-header

  - type: heading
    id: article-1
    level: 2
    text: Article 1 — Name

  - type: markdown
    content: |
      The name of the organization is **gloopglop.com**. Other names used by the cooperative include **gloop.gg** and **glop.coop**.

      The cooperative is currently operating as an organizing project and intends to formally incorporate as a cooperative under applicable state law.

  - type: markdown
    id: spacer-before-article-2

  - type: heading
    id: article-2
    level: 2
    text: Article 2 — Purpose

  - type: markdown
    content: |
      The purpose of the Cooperative is to operate a member-owned and democratically controlled enterprise that provides goods, services, or community benefit consistent with cooperative principles.

      The Cooperative exists to benefit its members and the broader community rather than outside investors.

  - type: markdown
    id: spacer-before-article-3

  - type: heading
    id: article-3
    level: 2
    text: Article 3 — Cooperative Principles

  - type: markdown
    content: |
      We adhere to the seven international cooperative principles as defined in [The Seven Cooperative Principles](/sevenprinciples).

  - type: markdown
    id: spacer-before-article-4

  - type: heading
    id: article-4
    level: 2
    text: Article 4 — Membership

  - type: heading
    id: article-4-1
    level: 3
    text: 4.1 — Requirements

  - type: markdown
    content: |
      Membership is open to individuals who:

      - Support the purpose of the Cooperative
      - Are accepted by the membership

  - type: heading
    id: article-4-2
    level: 3
    text: 4.2 — Rights

  - type: markdown
    content: |
      Every member has:

      - One vote in Cooperative decisions
      - The right to participate in governance
      - The ability to stand for elected roles

  - type: heading
    id: article-4-3
    level: 3
    text: 4.3 — Responsibilities

  - type: markdown
    content: |
      Members agree to:

      - Support the Cooperative and follow its governance processes

  - type: markdown
    id: spacer-before-article-5

  - type: heading
    id: article-5
    level: 2
    text: Article 5 — Democratic Governance

  - type: markdown
    content: |
      The Cooperative is governed by its members using democratic processes.

      Unless otherwise decided by the membership:

      - Each member has one vote
      - Decisions are made by [consent](/consent)
      - Members may elect coordinators or a board to carry out operations

  - type: markdown
    id: spacer-before-article-6

  - type: heading
    id: article-6
    level: 2
    text: Article 6 — Surplus and Finances

  - type: markdown
    content: |
      Any surplus generated by the Cooperative will be:

      - Reinvested in the Cooperative, and/or
      - Distributed to members according to their participation or labor contribution, and/or a standard payout as determined by the [MIT Living Wage Calculator](https://livingwage.mit.edu/)

      The Cooperative will not distribute profits to outside investors.

  - type: markdown
    id: spacer-before-article-7

  - type: heading
    id: article-7
    level: 2
    text: Article 7 — Amendments

  - type: markdown
    content: |
      These bylaws may be amended by a vote of the members.

  - type: markdown
    id: spacer-before-article-8

  - type: heading
    id: article-8
    level: 2
    text: Article 8 — Transition to Formal Cooperative

  - type: markdown
    content: |
      Upon incorporation as a legal cooperative entity, these bylaws may be replaced with formal bylaws consistent with cooperative law.