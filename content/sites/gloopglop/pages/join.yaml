id: join
title: Join GloopGlop
path: /join
layout: form
render_mode: modal

form:
  id: gloopglop_join
  title: Join GloopGlop
  intro: Tell us about yourself and how you'd like to participate.
  submit_label: Submit Application
  success_message: Thanks for applying to GloopGlop.

fields:
  - type: text
    name: name
    label: Name
    required: true

  - type: email
    name: email
    label: Email
    required: true

  - type: textarea
    name: why_join
    label: Why do you want to join GloopGlop?
    required: true
    rows: 5

  - type: textarea
    name: contributions
    label: What would you like to contribute?
    required: false
    rows: 4

  - type: checkbox
    name: agree_values
    label: I support the cooperative values of GloopGlop.
    required: true