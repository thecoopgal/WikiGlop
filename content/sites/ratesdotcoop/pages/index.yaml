id: index
title: Rates.coop
path: /
layout: landing

seo:
  title: Rates.coop — Credit union social pages
  description: Public rate and link pages for credit unions. Thousands of profiles, one deployment.

page_settings:
  show_header: true
  max_width: md

blocks:
  - type: hero
    id: hero
    headline: Credit union social pages
    subheadline: Each organization gets a lightweight link-in-bio style page. Profiles are stored as YAML under profiles/ and loaded on demand—so you can scale to thousands without bloating the JavaScript bundle.

  - type: markdown
    id: about
    body: |
      ### How it works

      - **Index** — Static pages live under `pages/` (this site uses `layout: landing`).
      - **Profiles** — Each credit union has a file `profiles/<slug>.yaml` with `layout: ratesdotcoop`.
      - **Routing** — Visiting `/<slug>` loads that profile from disk on the server (not bundled at build time).

      Try the sample profiles: [Example Community](/example-community) or [Demo FCU](/demo-fcu).

  - type: links
    id: samples
    title: Sample profiles
    style: cards
    items:
      - label: Example Community CU
        href: /example-community
      - label: Demo Federal Credit Union
        href: /demo-fcu
