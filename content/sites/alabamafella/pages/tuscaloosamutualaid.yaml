id: tuscaloosamutualaid
title: Tuscaloosa mutual aid
path: /tuscaloosamutualaid
layout: form

# Only visitors geolocated to the US state of Alabama (Cloudflare `cf.regionCode` / `cf-ipcountry`).
region_lock:
  countries:
    - US
  subdivisions:
    - AL

seo:
  title: Tuscaloosa mutual aid — request help
  description: Request lawn care, plumbing, electrical, food, or other help. We will look for a local organization or volunteer who can assist.

# Replace with the inbox that should receive requests (and configure RESEND_API_KEY / FORM_EMAIL_FROM).
send_email: mutualaid@alabamafella.gloopglop.com

form:
  id: tuscaloosa_mutual_aid
  title: Request help
  intro: |
    Tell us what you need — for example lawn care, plumbing, electrical, food, or something else.
    We will try to match you with an organization or neighbor who can help in the Tuscaloosa area.
  submit_label: Submit request
  cancel_label: Back to home
  success_message: Thanks — we received your request and will look for someone who can help.
  destination: tuscaloosa_mutual_aid

fields:
  - type: text
    name: name
    label: Your name
    required: true

  - type: email
    name: email
    label: Email
    required: true

  - type: text
    name: phone
    label: Phone (optional)
    required: false
    placeholder: (205) 555-0100

  - type: select
    name: need_category
    label: What do you need?
    required: true
    options:
      - label: Lawn care / yard work
        value: lawn
      - label: Plumbing
        value: plumbing
      - label: Electrical
        value: electrical
      - label: Food / groceries
        value: food
      - label: Other
        value: other

  - type: textarea
    name: details
    label: Details
    required: true
    rows: 5
    placeholder: Describe what you need, timing, and where in the Tuscaloosa area.
